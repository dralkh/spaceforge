name: Attest release assets

# Obsidian's review checks release assets for GitHub artifact attestations, and
# an attestation can only be issued by a workflow that built the file. That is
# the whole job here: build the tagged tree and attest it.
#
# Every quality gate — lint, the review mirror, typecheck, tests, the build
# comparison and `scripts/verify-release.mjs` — runs locally, on the commit that
# will be tagged, before the release exists. Nothing here re-runs them.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the release assets
        run: npm run build

      - name: Attest the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Upload the assets to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" main.js styles.css manifest.json --clobber
